<!DOCTYPE html>
<html lang="{{ lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ _("Page Not Found - AyushScan") }}</title>
    <style>
      body { font-family: Arial, sans-serif; background:#f8fafc; color:#111827; display:grid; place-items:center; min-height:100vh; margin:0; }
      main { max-width:520px; background:#fff; padding:2rem; border-radius:8px; box-shadow:0 10px 30px rgba(15,23,42,.08); }
      a { color:#2563eb; font-weight:700; }
    </style>
  </head>
  <body>
    <main>
      <h1>{{ _("Page not found") }}</h1>
      <p>{{ _("The page you requested is not available.") }}</p>
      <a href="/dashboard">{{ _("Go to dashboard") }}</a>
    </main>
  </body>
</html>
