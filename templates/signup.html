<!DOCTYPE html>
<html lang="{{ lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <title>{{ _("AyushScan - Signup") }}</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles/signup.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="title">
          {{ _("Join AyushScan") }}
        </div>
        <div class="subtitle">
          {{ _("Create your account to get started") }}
        </div>
      </div>

      <div id="formAlert" class="form-alert" role="alert" aria-live="polite" hidden></div>

      <form class="signup-form" id="signupForm" action="/signup" method="POST">
        <div class="form-group dual">
          <div class="half">
            <label class="form-label" for="firstName">
              {{ _("First Name") }}
            </label>
            <input
              type="text"
              id="firstName"
              name="firstName"
              class="form-input"
              placeholder="{{ _('First Name') }}"
              required
            />
          </div>
          <div class="half">
            <label class="form-label" for="lastName">
              {{ _("Last Name") }}
            </label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              class="form-input"
              placeholder="{{ _('Last Name') }}"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="username">
            {{ _("Username") }}
          </label>
          <div class="input-group">
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              placeholder="{{ _('Choose a username') }}"
              required
              autocomplete="username"
            />
            <span class="input-icon">👤</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">
            {{ _("Email Address") }}
          </label>
          <div class="input-group">
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="{{ _('Enter your email') }}"
              required
              autocomplete="email"
            />
            <span class="input-icon">📧</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            {{ _("Create Password") }}
          </label>
          <div class="input-group">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="{{ _('Enter your password') }}"
              required
              autocomplete="new-password"
            />
            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              aria-label="{{ _('Toggle password visibility') }}"
            >
              <span id="toggleIcon">👁️</span>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">
            {{ _("Confirm Password") }}
          </label>
          <div class="input-group">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="form-input"
              placeholder="{{ _('Confirm your password') }}"
              required
              autocomplete="new-password"
            />
            <button
              type="button"
              class="password-toggle"
              id="confirmPasswordToggle"
              aria-label="{{ _('Toggle confirm password visibility') }}"
            >
              <span id="confirmToggleIcon">👁️</span>
            </button>
          </div>
        </div>

        <button class="btn-submit" type="submit" id="submitButton">
          <span class="btn-text">
            {{ _("Sign Up") }}
          </span>
          <div class="btn-spinner"></div>
        </button>
      </form>

      <div class="alt-link">
        {% trans %}Already have an account?{% endtrans %}
        <a href="/login">{{ _("Login here") }}</a>
      </div>
    </div>

    <script>
      window.I18N = {
        firstNameRequired: "{{ _('First name is required') }}",
        lastNameRequired: "{{ _('Last name is required') }}",
        usernameTooShort: "{{ _('Username must be at least 3 characters') }}",
        invalidEmail: "{{ _('Please enter a valid email address') }}",
        weakPassword: "{{ _('Password needs 6+ chars, 1 uppercase, 1 lowercase, 1 number') }}",
        passwordsDontMatch: "{{ _('Passwords do not match') }}",
        confirmPasswordRequired: "{{ _('Please confirm your password') }}",
        signupFailed: "{{ _('Signup failed. Try again.') }}",
        somethingWentWrong: "{{ _('Something went wrong. Try again.') }}"
      };
    </script>
    <script src="{{ url_for('static', filename='scripts/form-utils.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/signup.js') }}"></script>
  </body>
</html>
