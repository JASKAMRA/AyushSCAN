<!DOCTYPE html>
<html lang="{{ lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ _("AyushScan - Welcome") }}</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles/index.css" />
  </head>
  <body>
    <div class="container">


      <!-- 🔰 Language Selector -->
      <form
        action="/set_language"
        method="POST"
        style="text-align: right; margin-bottom: 20px"
      >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <label for="language" style="margin-right: 10px">🌐 {{ _("Language") }}:</label>
        <select
          name="language"
          id="language"
          onchange="this.form.submit()"
          style="padding: 5px"
        >
          <option value="en" {% if lang == 'en' %}selected{% endif %}>English</option>
          <option value="hi" {% if lang == 'hi' %}selected{% endif %}>हिन्दी</option>
        </select>
      </form>
      <!-- 🔰 End Language Selector -->

      <div class="heading">{{ _("Welcome to") }}</div>
      <div class="main-title">{{ _("AyushScan") }}</div>
      <div class="logo-wrapper">
        <img src="{{ url_for('static', filename='images/LOGO.png') }}" alt="{{ _('AyushScan Logo') }}" class="logo-img" width="122" height="100" />
      </div>
      <div class="subheading">{{ _("Let’s Begin Your") }}</div>

      <div class="button-group">
        <button
          class="btn btn-start"
          onclick="window.location.href='{{ url_for('signup') }}'"
        >
          {{ _("Journey") }}
        </button>
        <button
          class="btn btn-about"
          onclick="window.location.href='{{ url_for('about') }}'"
        >
          {{ _("About Us") }}
        </button>
      </div>

      <div class="subheading">
        {{ _("Already a user?") }}
      </div>
      <button
        class="btn btn-login"
        onclick="window.location.href='{{ url_for('login') }}'"
      >
        {{ _("LOGIN") }}
      </button>
    </div>
  </body>
</html>
